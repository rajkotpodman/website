name: Build Android APK

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
  pull_request:
    branches: [master]
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build Next.js static export
        working-directory: website
        run: pnpm build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor CLI
        working-directory: website
        run: pnpm add -D @capacitor/cli @capacitor/android @capacitor/core

      - name: Add Android platform
        working-directory: website
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: website
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: website/android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: website/android/app/build/outputs/apk/debug/app-debug.apk
